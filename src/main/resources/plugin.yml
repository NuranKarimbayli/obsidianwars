name: ObsidianWars
version: '${version}'
main: az.nuran.obsidianwars.Obsidianwars
api-version: '1.21'
author: Nuran
description: A competitive Minecraft Bedwars-style plugin with obsidian destruction mechanics
website: https://github.com/nuran/obsidianwars
load: POSTWORLD

softdepend:
  - Vault
  - PlaceholderAPI

commands:
  obsidian:
    description: Main command for ObsidianWars
    usage: /obsidian <subcommand>
    aliases: [o, obsidianwars]
  join:
    description: Join an arena (alias for /o play)
    usage: /join [arena]
    aliases: [play]
  leave:
    description: Leave current arena (alias for /o leave)
    usage: /leave
  stats:
    description: View player statistics
    usage: /stats [player]
  rejoin:
    description: Rejoin after disconnect
    usage: /rejoin
  spectate:
    description: Spectate an arena or player
    usage: /spectate <arena|player>
  queue:
    description: Join queue for an arena
    usage: /queue [arena]

permissions:
  obsidianwars.*:
    description: Gives access to all ObsidianWars permissions
    children:
      obsidianwars.play: true
      obsidianwars.admin: true
  obsidianwars.play:
    description: Allows players to join and play games
    default: true
  obsidianwars.admin:
    description: Allows arena management and admin commands
    default: op