# ObsidianWars Main Configuration

# UI Features Toggle
# Set to false to disable built-in features if you prefer custom plugins
features:
  scoreboard: true
  tablist: true

# Database Configuration
# Options: "sqlite" or "mysql"
database:
  storage: "sqlite"
  sqlite:
    file-name: "stats.db"
  mysql:
    host: "localhost"
    port: 3306
    database: "obsidianwars"
    username: "root"
    password: "password"
    pool-size: 10

# System Language (Default: english)
language: "english"

# Respawn wait time in seconds (default: 5)
respawn-wait-time: 5

# Kill Streaks Configuration
kill-streaks:
  enabled: true
  rewards:
    3:
      points: 50
      message: "§e%player% is on a %streak% kill streak!"
      broadcast: false
    5:
      points: 100
      message: "§6%player% is dominating with %streak% kills!"
      broadcast: true
      broadcast-message: "§6§l%player% §eis on a §6§l%streak% §ekill streak!"
      effect: "SPEED"
      duration: 30
      amplifier: 0
    10:
      points: 200
      message: "§c§l%player% is UNSTOPPABLE with %streak% kills!"
      broadcast: true
      broadcast-message: "§c§l%player% §eis on a §c§l%streak% §ekill streak!"
      effect: "STRENGTH"
      duration: 20
      amplifier: 0

# Death Messages Configuration
death-messages:
  enabled: true
  sword: "§c%killer% §7slayed §c%victim% §7with a sword"
  axe: "§c%killer% §7axed §c%victim% §7to death"
  bow: "§c%killer% §7shot §c%victim% §7from %distance% blocks away"
  trident: "§c%killer% §7impaled §c%victim% §7with a trident"
  fists: "§c%killer% §7punched §c%victim% §7to death"
  void: "§c%victim% §7fell into the void"
  fall: "§c%victim% §7hit the ground too hard"
  fire: "§c%victim% §7burned to death"
  drown: "§c%victim% §7drowned"
  starve: "§c%victim% §7starved to death"
  suffocate: "§c%victim% §7suffocated"
  generic: "§c%victim% §7died"
  final-kill: "§4§lFINAL KILL! §c%killer% §7eliminated §c%victim%!"
  obsidian: "§c%killer% §7destroyed §c%victim%'s §cobsidian!"

# Health Display Configuration
health-display:
  tablist: true
  scoreboard: true
  above-head: false
  format: "hearts" # Options: "hearts" or "number"
  use-average: true # For scoreboard team health: true = average per player, false = total team health
  obsidian-integrity: true

# Default Timer Settings (Used if admin does not specify custom values during arena creation)
timers:
  # Default preparation time before bedrock walls drop (Format: 10m = 10 minutes)
  default-preparation: "10m"
  # Default time before Sudden Death mode triggers
  sudden-death: "30m"
  # Default total maximum game duration
  game-time: "45m"

# Allowed Resource Ore Types for /o arena setblocks
allowed-resource-blocks:
  - "COAL_ORE"
  - "DEEPSLATE_COAL_ORE"
  - "IRON_ORE"
  - "DEEPSLATE_IRON_ORE"
  - "GOLD_ORE"
  - "DEEPSLATE_GOLD_ORE"
  - "DIAMOND_ORE"
  - "DEEPSLATE_DIAMOND_ORE"
  - "EMERALD_ORE"
  - "DEEPSLATE_EMERALD_ORE"
  - "LAPIS_ORE"
  - "DEEPSLATE_LAPIS_ORE"
  - "REDSTONE_ORE"
  - "DEEPSLATE_REDSTONE_ORE"
  - "OAK_LOG"
  - "SPRUCE_LOG"
  - "BIRCH_LOG"
  - "JUNGLE_LOG"
  - "ACACIA_LOG"
  - "DARK_OAK_LOG"
  - "STONE"
  - "COBBLESTONE"

# Sound Effects Configuration
# Spigot Sound Reference: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Sound.html
sounds:
  join_lobby: "UI_TOAST_IN"
  match_start: "BLOCK_NOTE_BLOCK_PLING"
  obsidian_destroyed: "ENTITY_WITHER_DEATH"
  wall_fall: "ENTITY_ENDER_DRAGON_GROWL"
  protection_warn: "ENTITY_VILLAGER_NO"
  win_victory: "UI_TOAST_CHALLENGE_COMPLETE"
  countdown_tick: "BLOCK_NOTE_BLOCK_HAT"
  countdown_final: "BLOCK_NOTE_BLOCK_PLING"
  countdown_cancelled: "ENTITY_VILLAGER_NO"
  success: "ENTITY_PLAYER_LEVELUP"
  error: "ENTITY_VILLAGER_NO"

# Spigot Particle List: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Particle.html
# Particle Effects Configuration
particles:
  obsidian_target:
    type: "dust_color_transition"
    from_color: [0.7, 0.0, 1.0]
    to_color: [1.0, 0.0, 0.2]
    scale: 2.0

  resource_break:
    type: "dust_color_transition"
    from_color: [0.9, 0.8, 0.7]
    to_color: [1.0, 1.0, 1.0]
    scale: 1.0

# Mob Area Settings for /o arena setmobarea
mob-area:
  enabled: true
  mob-type: "ZOMBIE" # Spigot EntityType name
  spawn-interval-minutes: 1
  spawn-amount: 3
  max-mobs-per-area: 10

# Tab List Configuration
# Placeholders: %player%, %online%, %ping%, %kills%, %deaths%, %arena%, %phase%, %time%
tab:
  header:
    - "&d&lOBSIDIAN WARS"
    - "&7Welcome %player%!"
    - ""
  footer:
    - ""
    - "&7Online: &e%online% &7| Ping: &a%ping%ms"
    - "&7Kills: &a%kills% &7| Deaths: &c%deaths%"

# Scoreboard Configuration
# Placeholders: %player%, %arena%, %phase%, %time%, %kills%, %deaths%, %red_health%, %blue_health%
scoreboard:
  title: "&d&lOBSIDIAN WARS"
  lines:
    - "&7-------------------"
    - "&fArena: &a%arena%"
    - "&fPhase: &e%phase%"
    - "&fTime Left: &b%time%"
    - ""
    - "&cRed Health: &a%red_health%"
    - "&9Blue Health: &a%blue_health%"
    - ""
    - "&fKills: &a%kills%"
    - "&fDeaths: &c%deaths%"
    - "&7-------------------"