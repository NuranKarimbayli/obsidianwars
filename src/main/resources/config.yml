# ObsidianWars Main Configuration

# UI Features Toggle
# Set to false to disable built-in features if you prefer custom plugins
features:
  scoreboard: true
  tablist: true

# Database Configuration
# Options: "sqlite" or "mysql"
database:
  storage: "sqlite"
  sqlite:
    file-name: "stats.db"
  mysql:
    host: "localhost"
    port: 3306
    database: "obsidianwars"
    username: "root"
    password: "password"
    pool-size: 10

# System Language (Default: english)
language: "english"

# Respawn wait time in seconds (default: 5)
respawn-wait-time: 5

# Health Display Configuration
health-display:
  tablist: true
  scoreboard: true
  above-head: false
  format: "hearts" # Options: "hearts" or "number"
  use-average: true # For scoreboard team health: true = average per player, false = total team health
  obsidian-integrity: true

# Default Timer Settings (Used if admin does not specify custom values during arena creation)
timers:
  # Default preparation time before bedrock walls drop (Format: 10m = 10 minutes)
  default-preparation: "10m"
  # Default time before Sudden Death mode triggers
  sudden-death: "30m"
  # Default total maximum game duration
  game-time: "45m"

# Sound Effects Configuration
# Spigot Sound Reference: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Sound.html
sounds:
  join_lobby: "UI_TOAST_IN"
  match_start: "BLOCK_NOTE_BLOCK_PLING"
  obsidian_destroyed: "ENTITY_WITHER_DEATH"
  wall_fall: "ENTITY_ENDER_DRAGON_GROWL"
  protection_warn: "ENTITY_VILLAGER_NO"
  win_victory: "UI_TOAST_CHALLENGE_COMPLETE"
  countdown_tick: "BLOCK_NOTE_BLOCK_HAT"
  countdown_final: "BLOCK_NOTE_BLOCK_PLING"
  countdown_cancelled: "ENTITY_VILLAGER_NO"
  success: "ENTITY_PLAYER_LEVELUP"
  error: "ENTITY_VILLAGER_NO"

# Spigot Particle List: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Particle.html
# Particle Effects Configuration
particles:
  obsidian_target:
    type: "dust_color_transition"
    from_color: [0.7, 0.0, 1.0]
    to_color: [1.0, 0.0, 0.2]
    scale: 2.0

  resource_break:
    type: "dust_color_transition"
    from_color: [0.9, 0.8, 0.7]
    to_color: [1.0, 1.0, 1.0]
    scale: 1.0

# Mob Area Settings for /o arena setmobarea
mob-area:
  enabled: true
  mob-type: "ZOMBIE" # Spigot EntityType name
  spawn-interval-minutes: 1
  spawn-amount: 3
  max-mobs-per-area: 10

# Tab List Configuration
# Placeholders: %player%, %online%, %ping%, %kills%, %deaths%, %arena%, %phase%, %time%
tab:
  header:
    - "&d&lOBSIDIAN WARS"
    - "&7Welcome %player%!"
    - ""
  footer:
    - ""
    - "&7Online: &e%online% &7| Ping: &a%ping%ms"
    - "&7Kills: &a%kills% &7| Deaths: &c%deaths%"

# Scoreboard Configuration
# Placeholders: %player%, %arena%, %phase%, %time%, %kills%, %deaths%, %red_health%, %blue_health%, %level%, %level_formatted%, %xp%, %req_xp%, %progress_bar%
scoreboard:
  title: "&d&lOBSIDIAN WARS"
  lines:
    - "&7-------------------"
    - "&fArena: &a%arena%"
    - "&fPhase: &e%phase%"
    - "&fTime Left: &b%time%"
    - ""
    - "&cRed Health: &a%red_health%"
    - "&9Blue Health: &a%blue_health%"
    - ""
    - "&fKills: &a%kills%"
    - "&fDeaths: &c%deaths%"
    - "&7-------------------"

# Lobby Scoreboard Configuration
# Placeholders: {player}, {date}, {server_id}, {level}, {level_formatted}, {xp}, {current_xp_k}, {req_xp}, {req_xp_k}, {progress_bar}, {kills}, {wins}, {winstreak}, {server_address}
lobby-scoreboard:
  enabled: true
  server-id: "L26E"
  server-address: "yourserver.net"
  title: "&e&lOBSIDIAN WARS"
  lines:
    - "&7{date} &8{server_id}"
    - ""
    - "Level: &f{level_formatted}"
    - ""
    - "Progress: &b{current_xp_k}&7/&a{req_xp_k}"
    - "&8[{progress_bar}&8]"
    - ""
    - "Total Kills: &a{kills}"
    - "Total Wins: &a{wins}"
    - "Winstreak: &a{winstreak}"
    - ""
    - "&e{server_address}"

# XP Rewards Configuration
# Adjust these values to control how much XP players earn for various actions
xp-rewards:
  kill: 10
  final-kill: 20
  obsidian-broken: 50
  win: 100
  per-minute-played: 5

# Level-Up Configuration
level-up:
  # Broadcast level-up to entire server (true) or just the player (false)
  broadcast: false
  # Title shown to player when leveling up
  title: "&a&lLEVEL UP!"
  # Subtitle shown to player when leveling up (placeholders: {level}, {player})
  subtitle: "&7You are now Level &e{level}"
  # Sound effect played on level-up
  sound: "ENTITY_PLAYER_LEVELUP"
  # Chat message sent to player (placeholders: {level}, {player})
  message: "&aCongratulations! You are now Level &e{level}!"
  # Broadcast message sent to server if broadcast is true (placeholders: {level}, {player})
  broadcast-message: "&e{player} &ahas reached Level &e{level}!"